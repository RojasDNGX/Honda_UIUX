<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel KTA - Pendências</title>
<style>
  :root {
    --red: #E2001A;
    --text-dark: #1a1a1a;
    --border: #cfcfcf;
    --bar-bg: #ececec;
    --sidebar-bg: #eceef3;
    --header-bg: #f3f3f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Tahoma, "Segoe UI", Verdana, Arial, sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    background: #fff;
    display: flex;
    flex-direction: column;
    border-top: 3px solid #3b3326;
  }

  /* Cabeçalho: logo HONDA Serviços Financeiros, dados de ambiente/usuário e botão Sair. */
  .app-header {
    flex: 0 0 auto;
    height: 74px;
    display: flex;
    align-items: stretch;
    background: #fff;
  }
  .brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 22px;
    text-decoration: none;
  }
  .brand-honda {
    font-family: "Times New Roman", Georgia, serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 0.5px;
    color: var(--red);
    -webkit-text-stroke: 0.8px var(--red);
    transform: scaleX(1.32);
    transform-origin: left center;
  }
  .brand-sub {
    margin-top: 5px;
    font-family: Verdana, Tahoma, sans-serif;
    font-size: 16px;
    color: #6b6b6b;
    letter-spacing: 0.3px;
  }
  .header-spacer { flex: 1; }
  .header-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding-right: 260px;
    font-family: Verdana, Tahoma, sans-serif;
    font-size: 12px;
    color: #111;
  }
  .btn-sair {
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    text-decoration: underline;
  }
  .btn-sair:hover { background: #c40017; }

  /* Barra de menus: clique abre o dropdown; com um aberto, passar o mouse sobre
     outro item da barra troca o menu (comportamento clássico de menubar). */
  .menubar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 31px;
    padding-left: 6px;
    background: linear-gradient(#f2f2f2, #e4e4e4);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 50;
  }
  .menu-root { position: relative; height: 100%; display: flex; align-items: center; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 25px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: none;
    font-family: inherit;
    font-size: 14px;
    color: #222;
    cursor: pointer;
  }
  .menu-item:hover { background: #dcdcdc; }
  .menu-root.open .menu-item {
    background: #e2e2e2;
    border-color: #9a9a9a;
  }
  .menu-item:focus { outline: none; }
  .menu-item:focus-visible { outline: 1px dotted #333; outline-offset: -3px; }
  .menu-caret {
    width: 0; height: 0;
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-top: 4px solid #333;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: calc(100% - 1px);
    left: 0;
    min-width: 140px;
    padding: 2px 0;
    list-style: none;
    background: #f0f0f0;
    border: 1px solid #c5c5c5;
    box-shadow: 2px 3px 6px rgba(0,0,0,0.22);
  }
  .menu-root.open > .dropdown { display: block; }
  .dd-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 27px;
    margin: 0 3px;
    padding: 0 26px 0 33px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-size: 14px;
    color: #222;
    white-space: nowrap;
    cursor: pointer;
  }
  .dd-item.has-sub { padding-right: 42px; }
  .dd-item:hover,
  .dd-item.has-sub:hover {
    background: linear-gradient(#f7f7f7, #dedede);
    border-color: #a9a9a9;
  }
  .dd-arrow {
    position: absolute;
    right: 10px;
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #888;
  }
  /* Submenu abre à direita do item pai ao passar o mouse. */
  .dropdown.sub { top: -4px; left: calc(100% + 1px); }
  .dd-item.has-sub:hover > .dropdown.sub { display: block; }

  .page-title {
    flex: 0 0 auto;
    padding: 6px 12px 6px 12px;
    font-size: 23px;
    font-weight: 700;
    color: #000;
  }

  /* Área principal: painel de consultas à esquerda (recolhível) e grade de pendências. */
  .workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    margin: 0 6px 2px 6px;
    border: 1px solid var(--border);
  }

  .sidebar {
    flex: 0 0 292px;
    width: 292px;
    display: flex;
    flex-direction: column;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
  }
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 30px;
    padding: 0 6px;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--border);
    gap: 4px;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 5px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 13px;
    color: #222;
    cursor: pointer;
    border-radius: 2px;
  }
  .tool-btn:hover { background: #dcdcdc; }
  .tool-btn svg { display: block; flex-shrink: 0; }
  .toolbar .push { margin-left: auto; }

  .query-list { list-style: none; padding-top: 2px; }
  .query-list li {
    padding: 4px 10px 4px 42px;
    font-size: 13px;
    color: #111;
    cursor: pointer;
    white-space: nowrap;
  }
  .query-list li:hover { background: #dde1ea; }
  .query-list li.selected { background: #d3d9e6; }

  /* Painel recolhido: só a faixa com o botão de expandir permanece visível. */
  .workspace.collapsed .sidebar { flex-basis: 30px; width: 30px; }
  .workspace.collapsed .sidebar .tool-btn:not(.btn-collapse),
  .workspace.collapsed .query-list { display: none; }
  .workspace.collapsed .btn-collapse svg { transform: rotate(180deg); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .main .toolbar { gap: 10px; }

  .grid-wrap { flex: 1; overflow: auto; }
  .grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .grid th {
    height: 27px;
    padding: 0 7px;
    text-align: left;
    font-weight: 400;
    font-size: 13px;
    color: #111;
    background: var(--header-bg);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .grid th:last-child { border-right: none; }
</style>
</head>
<body>

  <header class="app-header">
    <a class="brand" href="../index.html" title="Voltar à Home">
      <span class="brand-honda">HONDA</span>
      <span class="brand-sub">Serviços Financeiros</span>
    </a>
    <div class="header-spacer"></div>
    <div class="header-info">
      <div>Ambiente: Homologação</div>
      <div>Usuário: thiago.rojas</div>
    </div>
    <a class="btn-sair" href="../index.html">Sair</a>
  </header>

  <nav class="menubar" id="menubar"></nav>

  <h1 class="page-title">Pendências</h1>

  <div class="workspace" id="workspace">
    <aside class="sidebar">
      <div class="toolbar">
        <button type="button" class="tool-btn" title="Nova consulta">
          <svg width="14" height="14" viewBox="0 0 14 14" stroke="#222" stroke-width="1.5"><path d="M7 1v12M1 7h12"/></svg>
        </button>
        <button type="button" class="tool-btn" title="Aplicar consulta">
          <svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#222"/><path d="M6.5 12.5l3.5 3.5 7-7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="tool-btn" title="Excluir consulta">
          <svg width="13" height="15" viewBox="0 0 13 15" fill="#222"><rect x="0" y="1.5" width="13" height="2" rx="0.5"/><rect x="4.5" y="0" width="4" height="2" rx="0.5"/><path d="M1.3 4.5h10.4l-0.8 9.6a1 1 0 0 1-1 0.9H3.1a1 1 0 0 1-1-0.9z"/></svg>
        </button>
        <button type="button" class="tool-btn push btn-collapse" id="btnCollapse" title="Recolher painel">
          <svg width="8" height="12" viewBox="0 0 8 12" fill="none" stroke="#222" stroke-width="1.5"><path d="M6.5 1L1.5 6l5 5"/></svg>
        </button>
      </div>
      <ul class="query-list">
        <li>Minhas consultas</li>
        <li>Consultas compartilhadas</li>
      </ul>
    </aside>

    <section class="main">
      <div class="toolbar">
        <button type="button" class="tool-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.5v5h-5" stroke-linejoin="round"/></svg>
          Recarregar
        </button>
        <button type="button" class="tool-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#222"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          Editar consulta
        </button>
      </div>
      <div class="grid-wrap">
        <table class="grid">
          <colgroup>
            <col style="width:20%"><col style="width:20%"><col style="width:5%">
            <col style="width:20%"><col style="width:20%"><col style="width:5%"><col style="width:10%">
          </colgroup>
          <thead>
            <tr>
              <th>Activity Name</th>
              <th>Process</th>
              <th>Priority</th>
              <th>Due Date</th>
              <th>Assigned To</th>
              <th title="SLA (Activity)">SLA (Activity)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // Estrutura dos menus da barra superior. Itens com "sub" abrem um submenu à direita.
    var MENUS = [
      { label: "Consultas", items: ["Processos", "Pendências"] },
      { label: "Administração", items: [
        { label: "Processos HSF", sub: [
          "Checklist Documentos",
          "Consultar Job",
          "Reenviar Documentos Banco (BHB)",
          "Reprocessar Job Formalização CNH/BHB"
        ] },
        { label: "Assinatura Remota", sub: [
          "Solicitantes",
          "Documentos x Solicitantes",
          "Certificado"
        ] },
        "Reset Taken Activities",
        "Resultado Validação"
      ] },
      { label: "Relatórios", items: [
        "Histórico de Formalização",
        "Contador Acessos Vídeo Assinatura",
        "Resumo Geral",
        "Tempo Médio",
        "Comparativos",
        "Log Processo",
        "Controle Dados Processos",
        "Controle Dados Processos - Validação",
        "Retorno XML por Proposta",
        "Avaliação - Assinatura Remota",
        "Transações de Propostas na Etapa Assinatura",
        "Contadores Honda",
        "Relatorio Acurácia OCR e Validação Automática"
      ] },
      { label: "Stoque", items: ["Documentos Formalização", "Criar Usuários em Lote"] }
    ];

    var menubar = document.getElementById("menubar");

    function buildDropdown(items, isSub) {
      var ul = document.createElement("ul");
      ul.className = "dropdown" + (isSub ? " sub" : "");
      items.forEach(function (entry) {
        var li = document.createElement("li");
        li.className = "dd-item";
        if (typeof entry === "string") {
          li.textContent = entry;
        } else {
          li.classList.add("has-sub");
          li.textContent = entry.label;
          var arrow = document.createElement("span");
          arrow.className = "dd-arrow";
          li.appendChild(arrow);
          li.appendChild(buildDropdown(entry.sub, true));
        }
        ul.appendChild(li);
      });
      return ul;
    }

    MENUS.forEach(function (menu) {
      var root = document.createElement("div");
      root.className = "menu-root";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "menu-item";
      btn.innerHTML = menu.label + ' <span class="menu-caret"></span>';
      root.appendChild(btn);
      root.appendChild(buildDropdown(menu.items, false));
      menubar.appendChild(root);

      btn.addEventListener("click", function () {
        var wasOpen = root.classList.contains("open");
        closeMenus();
        if (!wasOpen) root.classList.add("open");
      });
      // Com algum menu já aberto, passar o mouse em outro item da barra troca o menu.
      btn.addEventListener("mouseenter", function () {
        if (menubar.querySelector(".menu-root.open") && !root.classList.contains("open")) {
          closeMenus();
          root.classList.add("open");
          btn.focus();
        }
      });
    });

    function closeMenus() {
      menubar.querySelectorAll(".menu-root.open").forEach(function (r) { r.classList.remove("open"); });
    }

    // Clicar numa opção final (sem submenu) fecha o menu; as telas de destino ainda serão definidas.
    menubar.addEventListener("click", function (e) {
      var item = e.target.closest(".dd-item");
      if (item && !item.classList.contains("has-sub")) closeMenus();
    });
    document.addEventListener("click", function (e) {
      if (!menubar.contains(e.target)) closeMenus();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeMenus();
    });

    // Recolhe/expande o painel de consultas pelo botão "<".
    var workspace = document.getElementById("workspace");
    var btnCollapse = document.getElementById("btnCollapse");
    btnCollapse.addEventListener("click", function () {
      var collapsed = workspace.classList.toggle("collapsed");
      btnCollapse.title = collapsed ? "Expandir painel" : "Recolher painel";
    });

    // Seleção visual das consultas salvas.
    document.querySelectorAll(".query-list li").forEach(function (item) {
      item.addEventListener("click", function () {
        document.querySelectorAll(".query-list li").forEach(function (li) { li.classList.remove("selected"); });
        item.classList.add("selected");
      });
    });
  </script>

</body>
</html>
