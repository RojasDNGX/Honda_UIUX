<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel KTA</title>
<style>
  :root {
    --red: #D6001C;
    --text-dark: #1a1a1a;
    --text-gray-light: #9a9a9a;
    --border-light: #cfcfcf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    font-size: 15px;
    color: var(--text-dark);
    background: #fff;
  }

  .topbar-strip { height: 4px; background: #1a1a1a; }
  .topbar { background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 12px 28px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .logo { flex: 0 0 auto; display: flex; align-items: center; }

  .breadcrumb { display: flex; align-items: center; gap: 10px; flex: 1; }
  .crumb { font-size: 16px; color: #222; padding-bottom: 6px; white-space: nowrap; text-decoration: none; }
  .crumb:hover { text-decoration: underline; }
  .crumb.active { font-weight: 700; color: #111; border-bottom: 3px solid var(--red); }
  .crumb-sep { color: #999; font-size: 15px; }

  .page { max-width: 1280px; margin: 0 auto; padding: 32px 40px 60px 40px; }

  .page-title { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .page-title h1 { font-size: 26px; font-weight: 700; color: #111; }

  .blank-area {
    border: 2px dashed var(--border-light);
    border-radius: 12px;
    min-height: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-gray-light);
    font-size: 15px;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>

  <div class="topbar-strip"></div>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <svg width="52" height="30" viewBox="0 0.75 42 24.5" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.2975 11.25C7.21 11.25 7.105 11.25 7 11.25H7.2975ZM23.4675 0.75H15.75V4.25H22.0325L25.5325 7.75H19.25L12.25 11.25L8.75 7.75H0V11.25H7C3.1325 11.25 0 14.3825 0 18.25C0 22.1175 3.1325 25.25 7 25.25C10.8675 25.25 14 22.1175 14 18.25L17.5 21.75H22.75L28.8575 11.075L30.625 12.8425C29.0325 14.12 28 16.0625 28 18.25C28 22.1175 31.1325 25.25 35 25.25C38.8675 25.25 42 22.1175 42 18.25C42 14.3825 38.8675 11.25 35 11.25C34.685 11.25 34.37 11.3025 34.0725 11.3375L30.4675 7.75H35V2.5L28.49 5.755L23.4675 0.75ZM35 21.75C33.075 21.75 31.5 20.175 31.5 18.25C31.5 16.325 33.075 14.75 35 14.75C36.925 14.75 38.5 16.325 38.5 18.25C38.5 20.175 36.925 21.75 35 21.75ZM7 21.75C5.075 21.75 3.5 20.175 3.5 18.25C3.5 16.325 5.075 14.75 7 14.75C8.925 14.75 10.5 16.325 10.5 18.25C10.5 20.175 8.925 21.75 7 21.75Z" fill="#CC0000"/>
        </svg>
      </div>
      <nav class="breadcrumb">
        <a class="crumb" href="../index.html">Home</a>
        <span class="crumb-sep">&rsaquo;</span>
        <span class="crumb active">Painel KTA</span>
      </nav>
    </div>
  </div>

  <div class="page">
    <div class="page-title">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D6001C" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <h1>Painel KTA</h1>
    </div>

    <div class="blank-area">Tela em branco — projeto ainda a iniciar.</div>
  </div>

</body>
</html>
